<!DOCTYPE html>
<html><head><title>Multi-Step Login (Step 2) - LoginLab</title>
<style>body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:white;padding:40px;border-radius:12px;max-width:400px;width:100%;}h1{margin:0 0 20px;}</style>
</head><body><div class="card"><h1>Step 2: Password</h1>
<p style="margin-bottom:20px;color:#666;">Email: {{ email }}</p>
<form method="POST" action="/multi-step/password"><input type="hidden" name="state" value="{{ state }}">
<label>Password:<br><input type="password" name="password" required style="width:100%;padding:10px;margin:10px 0;"></label>
<button type="submit" style="width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:6px;cursor:pointer;">Sign In</button></form>
{% if error %}<p style="color:#c62828;margin-top:15px;">{{ error }}</p>{% endif %}
<p style="margin-top:20px;font-size:0.9em;color:#666;">Test: TestPass123!</p></div></body></html>
