<!DOCTYPE html>
<html lang="en" data-scenario="google-oauth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <meta data-auth-type="oauth" data-scenario="google-oauth">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Google Sans', 'Roboto', system-ui, sans-serif;
            background: #f0f4f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15);
            padding: 48px 40px;
            border: 1px solid #dadce0;
        }

        .google-logo {
            text-align: center;
            margin-bottom: 16px;
        }

        .google-logo svg {
            width: 75px;
            height: 24px;
        }

        .login-card h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #5f6368;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .input-container {
            position: relative;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.2s;
            font-family: inherit;
            color: #202124;
        }

        input:focus {
            outline: none;
            border-color: #1a73e8;
            border-width: 2px;
            padding: 12px 14px;
        }

        .floating-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #5f6368;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s;
            background: white;
            padding: 0 4px;
        }

        input:focus + .floating-label,
        input:not(:placeholder-shown) + .floating-label {
            top: 0;
            font-size: 12px;
            color: #1a73e8;
        }

        .forgot-link {
            display: inline-block;
            margin-top: 8px;
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .info-text {
            color: #5f6368;
            font-size: 14px;
            margin-top: 24px;
            line-height: 1.5;
        }

        .info-text a {
            color: #1a73e8;
            text-decoration: none;
        }

        .info-text a:hover {
            text-decoration: underline;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }

        .btn-text {
            padding: 10px 24px;
            background: transparent;
            color: #1a73e8;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-text:hover {
            background: rgba(26, 115, 232, 0.04);
        }

        .btn-primary {
            padding: 10px 24px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            min-width: 90px;
        }

        .btn-primary:hover {
            background: #1557b0;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
        }

        .error {
            background: #fce8e6;
            color: #c5221f;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .error svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .hint {
            background: #e8f0fe;
            padding: 16px;
            border-radius: 8px;
            margin-top: 24px;
            font-size: 13px;
        }

        .hint strong {
            display: block;
            margin-bottom: 8px;
            color: #1a73e8;
        }

        code {
            background: #d2e3fc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #5f6368;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #1a73e8;
        }

        .language-selector {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #dadce0;
        }

        .language-selector select {
            padding: 8px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            color: #5f6368;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Google Logo -->
            <div class="google-logo">
                <svg viewBox="0 0 75 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M18.4 12.2c0-.7-.1-1.4-.2-2H9.4v3.9h5c-.2 1.2-.9 2.2-1.9 2.9v2.4h3.1c1.8-1.7 2.8-4.1 2.8-7.2z"/>
                    <path fill="#34A853" d="M9.4 19c2.6 0 4.7-.9 6.3-2.3l-3.1-2.4c-.9.6-2 .9-3.2.9-2.5 0-4.6-1.7-5.3-3.9H.9v2.5C2.5 17 5.7 19 9.4 19z"/>
                    <path fill="#FBBC05" d="M4.1 11.3c-.2-.6-.3-1.2-.3-1.8s.1-1.3.3-1.8V5.1H.9C.3 6.3 0 7.6 0 9s.3 2.7.9 3.9l3.2-2.6z"/>
                    <path fill="#EA4335" d="M9.4 3.6c1.4 0 2.7.5 3.7 1.4l2.7-2.7C14.1.9 11.9 0 9.4 0 5.7 0 2.5 2 .9 5.1l3.2 2.6c.7-2.2 2.8-4.1 5.3-4.1z"/>
                    <text x="24" y="16" fill="#5f6368" font-family="Google Sans, sans-serif" font-size="16">Google</text>
                </svg>
            </div>

            <h1>Sign in</h1>
            <p class="subtitle">Use your Google Account</p>

            {% if error %}
            <div class="error">
                <svg viewBox="0 0 24 24" fill="#c5221f">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/demo/google" data-login-form="true" id="loginForm">
                <div class="form-group">
                    <div class="input-container">
                        <input
                            type="email"
                            id="email"
                            name="username"
                            placeholder=" "
                            data-field="username"
                            required
                            autocomplete="username"
                        >
                        <label for="email" class="floating-label">Email or phone</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot email?</a>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder=" "
                            data-field="password"
                            required
                            autocomplete="current-password"
                        >
                        <label for="password" class="floating-label">Enter your password</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <p class="info-text">
                    Not your computer? Use Guest mode to sign in privately.
                    <a href="#">Learn more about using Guest mode</a>
                </p>

                <div class="button-row">
                    <button type="button" class="btn-text">Create account</button>
                    <button type="submit" class="btn-primary" id="loginButton" data-action="login">
                        Next
                    </button>
                </div>
            </form>

            <div class="hint">
                <strong>Demo Credentials:</strong>
                Email: <code>demo@example.com</code><br>
                Password: <code>GoogleDemo123!</code>
            </div>

            <div class="language-selector">
                <select>
                    <option value="en">English (United States)</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
        </div>

        <a href="/" class="back-link">← Back to Scenarios</a>
    </div>

    <script>
        console.log('[LoginLab] Google OAuth demo page loaded', {
            scenario: 'google-oauth',
            auth_type: 'oauth',
            timestamp: new Date().toISOString()
        });
    </script>
</body>
</html>
