<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Area - LoginLab</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    pre { background: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; }
    input, button { font: inherit; padding: 6px 10px; margin: 4px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Protected Area</h1>
    <p>Welcome, <strong>{{ user.display_name }}</strong> ({{ user.role }})</p>

    <section>
      <h3>Session Details</h3>
      <pre>{{ user }}</pre>
    </section>

    <section>
      <h3>Received Cookies</h3>
      <pre>{{ cookies }}</pre>
    </section>

    <section>
      <h3>Protected Form</h3>
      <form method="post" action="/protected/action">
        <label for="input">Test Input</label>
        <input type="text" id="input" name="input" value="scanner_payload" />
        <button type="submit">Submit</button>
      </form>
    </section>

    <p><a href="/form-login/logout">Logout</a></p>
  </main>
</body>
</html>
