<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LoginLab · Domain Dashboard</title>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 48px; }
    .card { background: rgba(30,41,59,0.8); border: 1px solid rgba(148,163,184,0.3); border-radius: 16px; padding: 20px 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    h1 { margin: 0 0 10px; }
    p { margin: 0 0 10px; color: #94a3b8; }
    .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; background: rgba(59,130,246,0.2); color: #bfdbfe; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="pill">Authenticated</div>
      <h1>Welcome, {{ user.display_name or user.username or 'User' }}</h1>
      <p>Session cookie is set. You reached the dashboard after selecting your domain.</p>
      <p class="pill" style="background: rgba(16,185,129,0.15); color: #a7f3d0;">Role: {{ user.role }}</p>
      <p style="color: #94a3b8;">Try logging out and back in to exercise the domain select flow again.</p>
      <p><a href="/form-login-domain" style="color: #93c5fd;">Back to login</a></p>
    </div>
  </div>
</body>
</html>
