<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LoginLab · Account Overview</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 48px 20px; }
    .card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 16px; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 14px; color: #94a3b8; }
    label { display: block; margin-bottom: 14px; font-size: 14px; color: #cbd5e1; }
    input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.3); background: rgba(15, 23, 42, 0.7); color: #e2e8f0; }
    button { width: 100%; padding: 11px 14px; border-radius: 10px; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    .error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(248, 113, 113, 0.4); color: #fecdd3; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; }
    .meta { font-size: 13px; color: #94a3b8; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Account Overview</h1>
      <p>Signed in as {{ user.display_name }} ({{ user.role }}).</p>
      <p class="meta">Account: {{ user.username }}</p>
      <a href="/">Back to LoginLab</a>
    </div>
  </div>
</body>
</html>
