# Static SPA server for the AuthRecon frontend (nginx-unprivileged, non-root).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Content-Security-Policy: scripts only from this app (no inline script, no
    # eval), connections only to the app and the portal (filled in from the
    # VITE_* build args by Dockerfile.frontend), no framing either way. Images
    # allow data:/blob: (QR codes, screenshots fetched through the API); fonts
    # data: (small bundled font files are inlined by the build).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'" always;

    # Hashed build assets can be cached; index.html must not be.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never serve dotfiles (.git, .env, ...) even if one ends up in the image.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # Same CSP as above (add_header in a location replaces the server-level ones).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'" always;
    }
}
