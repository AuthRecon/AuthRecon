# Static SPA server for the AuthRecon frontend (nginx-unprivileged, non-root).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed build assets can be cached; index.html must not be.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never serve dotfiles (.git, .env, ...) even if one ends up in the image.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
