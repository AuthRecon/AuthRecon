name: tests

on:
  push:
    branches: [public-release, main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment gives the version).
jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions match each service's Dockerfile base image.
          - service: authrecon-api
            dir: backend/authrecon/backend
            python: "3.11"
          - service: portal
            dir: backend/security-portal
            python: "3.12"
          - service: authrecon-mcp
            dir: backend/authrecon-mcp
            python: "3.12"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # Unit tests only: SQLite and mocked transports, no browsers or services.
      - run: python -m pytest -q tests
      # Known vulnerabilities in the service's pinned dependencies.
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # Known vulnerabilities in code that ships to the browser.
      - run: npm audit --omit=dev --audit-level=moderate

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The files as they are now (rules and allowlist: .gitleaks.toml).
      - run: >
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2
          dir /repo --no-banner --redact -c /repo/.gitleaks.toml
