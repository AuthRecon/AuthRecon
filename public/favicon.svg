<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1e293b"/>

  <!-- Shield outline -->
  <path d="M16 5 L24 8 L24 14 C24 19 21 22.5 16 26 C11 22.5 8 19 8 14 L8 8 Z"
        stroke="#60a5fa"
        stroke-width="2"
        fill="none"
        stroke-linejoin="round"/>

  <!-- Shield fill gradient -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <path d="M16 5.5 L23.5 8.25 L23.5 14 C23.5 18.75 20.75 22 16 25.5 C11.25 22 8.5 18.75 8.5 14 L8.5 8.25 Z"
        fill="url(#shieldGrad)"/>

  <!-- Lock symbol inside shield -->
  <rect x="14" y="13.5" width="4" height="5" rx="0.5"
        fill="#60a5fa"
        stroke="#3b82f6"
        stroke-width="0.5"/>
  <path d="M14.5 13.5 L14.5 12 C14.5 11.2 15.2 10.5 16 10.5 C16.8 10.5 17.5 11.2 17.5 12 L17.5 13.5"
        stroke="#60a5fa"
        stroke-width="1.5"
        fill="none"
        stroke-linecap="round"/>

  <!-- Small dot for keyhole -->
  <circle cx="16" cy="15.75" r="0.75" fill="#1e293b"/>
</svg>
